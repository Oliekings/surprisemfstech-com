<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="8"/>
  
  <!-- Subtle inner grid accent -->
  <path d="M128 64v384M256 64v384M384 64v384M64 128h384M64 256h384M64 384h384" stroke="#f59e0b" stroke-opacity="0.04" stroke-width="2"/>

  <!-- Glowing futuristic 'S' monogram -->
  <g filter="url(#glow)">
    <!-- Top arc of S -->
    <path d="M 370 180 C 370 135, 335 105, 256 105 C 177 105, 142 140, 142 185 C 142 245, 370 240, 370 325 C 370 375, 330 407, 256 407 C 172 407, 142 370, 142 325" 
          fill="none" 
          stroke="url(#amberGrad)" 
          stroke-width="52" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
          
    <!-- Dynamic high-tech accent dots / dashes -->
    <circle cx="370" cy="180" r="14" fill="#fbbf24" />
    <circle cx="142" cy="325" r="14" fill="#fbbf24" />
    <circle cx="256" cy="256" r="10" fill="#f59e0b" />
  </g>
</svg>
